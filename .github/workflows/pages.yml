name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Buang sisa file Grok/TanStack lama yang mungkin masih ada di repo
      # (upload lewat web GitHub tidak menghapus file lama).
      - name: Bersihkan sisa file lama
        run: |
          rm -rf server migrations .tanstack .vercel .grok attachments artifacts screenshots public/__grok
          rm -rf src/routes src/router.tsx src/routeTree.gen.ts src/lib/auth src/lib/app-data src/lib/multiplayer
          rm -f src/lib/db.ts src/lib/env.server.ts src/lib/error-component.tsx src/lib/preview-*.ts src/components/preview-host-bridge.tsx
          rm -f vercel.json startup.sh AGENTS.md eslint.config.mjs package-lock.json
          find scripts -type f ! -name meja-audit.ts -delete
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
