name: Meja

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerbang
        run: node --experimental-strip-types scripts/meja-audit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: meja-report
          path: data/meja-report.md
